    <script>
      // Filter benign Vite development websocket connection notices in container proxy environments
      window.addEventListener('error', function (e) {
        if (e && e.message && (e.message.includes('WebSocket closed without opened') || e.message.includes('failed to connect to websocket'))) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        if (e && e.reason && (e.reason.message || String(e.reason)).includes('WebSocket closed without opened')) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      }, true);
      (function() {
        const _origErr = console.error;
        console.error = function(...args) {
          const msg = args[0] ? String(args[0]) : '';
          if (msg.includes('[vite] failed to connect to websocket') || msg.includes('WebSocket closed without opened')) {
            return;
          }
          _origErr.apply(console, args);
        };
      })();
    </script>
